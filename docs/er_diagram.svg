<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="900" viewBox="0 0 1480 900" role="img" aria-labelledby="title desc">
  <title id="title">Manufacturing Yield Database ER Diagram</title><desc id="desc">Normalized PostgreSQL schema for manufacturing test analysis.</desc>
  <defs><style>.bg{fill:#f4f7fb}.box{fill:#fff;stroke:#8aa0b8;stroke-width:2}.head{fill:#0b1f3a}.h{font:700 18px 'Segoe UI',sans-serif;fill:#fff}.t{font:14px 'Consolas',monospace;fill:#24364b}.edge{fill:none;stroke:#2f6bff;stroke-width:2.5}.label{font:600 13px 'Segoe UI',sans-serif;fill:#2f6bff}.note{font:15px 'Segoe UI',sans-serif;fill:#53677f}.title{font:700 28px 'Segoe UI',sans-serif;fill:#0b1f3a}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2f6bff"/></marker></defs>
  <rect class="bg" width="1480" height="900"/><text class="title" x="40" y="48">Manufacturing Test Yield — PostgreSQL ER Diagram</text><text class="note" x="40" y="75">PK = primary key · FK = foreign key · UK = unique key · Raw staging and reject tables omitted for clarity</text>
  <g transform="translate(40 120)"><rect class="box" width="280" height="170" rx="8"/><rect class="head" width="280" height="40" rx="8"/><text class="h" x="16" y="27">plant</text><text class="t" x="16" y="66">PK plant_id</text><text class="t" x="16" y="91">UK plant_code</text><text class="t" x="16" y="116">plant_name</text><text class="t" x="16" y="141">country · timezone_name</text></g>
  <g transform="translate(405 120)"><rect class="box" width="300" height="170" rx="8"/><rect class="head" width="300" height="40" rx="8"/><text class="h" x="16" y="27">production_line</text><text class="t" x="16" y="66">PK line_id</text><text class="t" x="16" y="91">FK plant_id</text><text class="t" x="16" y="116">UK line_code</text><text class="t" x="16" y="141">line_name</text></g>
  <g transform="translate(790 120)"><rect class="box" width="300" height="195" rx="8"/><rect class="head" width="300" height="40" rx="8"/><text class="h" x="16" y="27">production_lot</text><text class="t" x="16" y="66">PK lot_id</text><text class="t" x="16" y="91">UK lot_code</text><text class="t" x="16" y="116">FK line_id</text><text class="t" x="16" y="141">FK product_id</text><text class="t" x="16" y="166">planned_start_date</text></g>
  <g transform="translate(1165 120)"><rect class="box" width="275" height="195" rx="8"/><rect class="head" width="275" height="40" rx="8"/><text class="h" x="16" y="27">product</text><text class="t" x="16" y="66">PK product_id</text><text class="t" x="16" y="91">UK product_code</text><text class="t" x="16" y="116">product_name</text><text class="t" x="16" y="141">product_family</text><text class="t" x="16" y="166">target_cycle_seconds</text></g>
  <g transform="translate(40 570)"><rect class="box" width="300" height="195" rx="8"/><rect class="head" width="300" height="40" rx="8"/><text class="h" x="16" y="27">test_station</text><text class="t" x="16" y="66">PK station_id</text><text class="t" x="16" y="91">UK station_code</text><text class="t" x="16" y="116">station_name</text><text class="t" x="16" y="141">test_type (AOI/ICT/FCT)</text></g>
  <g transform="translate(405 390)"><rect class="box" width="685" height="430" rx="8"/><rect class="head" width="685" height="44" rx="8"/><text class="h" x="16" y="29">test_result — central fact table</text><text class="t" x="20" y="76">PK test_result_id</text><text class="t" x="20" y="104">UK source_row_number · serial_number</text><text class="t" x="20" y="132">FK lot_id · line_id · product_id</text><text class="t" x="20" y="160">FK station_id · failure_mode_id (nullable)</text><text class="t" x="20" y="204">shift_name · tested_at · outcome</text><text class="t" x="20" y="232">cycle_time_seconds · operator_code</text><text class="t" x="20" y="260">measurement · lower/upper spec limits</text><line x1="20" y1="286" x2="665" y2="286" stroke="#d8e1ec" stroke-width="2"/><text class="note" x="20" y="320">Integrity rules</text><text class="t" x="20" y="348">• outcome ∈ {PASS, FAIL}</text><text class="t" x="20" y="376">• FAIL requires a failure mode; PASS forbids one</text><text class="t" x="20" y="404">• positive cycle time and ordered spec limits</text></g>
  <g transform="translate(1165 570)"><rect class="box" width="275" height="195" rx="8"/><rect class="head" width="275" height="40" rx="8"/><text class="h" x="16" y="27">failure_mode</text><text class="t" x="16" y="66">PK failure_mode_id</text><text class="t" x="16" y="91">UK failure_code</text><text class="t" x="16" y="116">failure_category</text><text class="t" x="16" y="141">failure_description</text></g>
  <path class="edge" marker-end="url(#arrow)" d="M320 205 H405"/><text class="label" x="335" y="192">1 → many</text><path class="edge" marker-end="url(#arrow)" d="M705 205 H790"/><text class="label" x="718" y="192">1 → many</text><path class="edge" marker-end="url(#arrow)" d="M1165 220 H1090"/><text class="label" x="1094" y="207">1 → many</text><path class="edge" marker-end="url(#arrow)" d="M940 315 V390"/><text class="label" x="952" y="360">1 → many</text><path class="edge" marker-end="url(#arrow)" d="M555 290 V390"/><text class="label" x="567" y="345">1 → many</text><path class="edge" marker-end="url(#arrow)" d="M1302 315 V360 H1050 V390"/><text class="label" x="1180" y="350">1 → many</text><path class="edge" marker-end="url(#arrow)" d="M340 665 H405"/><text class="label" x="345" y="650">1 → many</text><path class="edge" marker-end="url(#arrow)" d="M1165 665 H1090"/><text class="label" x="1100" y="650">0..1 → many</text>
</svg>
