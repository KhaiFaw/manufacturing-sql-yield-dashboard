<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img"><title>Manufacturing analytics</title><rect width="960" height="820" rx="20" fill="#0B1623"/><text x="44" y="62" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="650">Manufacturing analytics</text><text x="44" y="100" fill="#5DE2D0" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">IMPLEMENTATION MAP</text><rect x="44" y="135" width="872" height="88" rx="10" fill="#122638" stroke="#284255"/><text x="66" y="169" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600">01  Generate</text><text x="66" y="201" fill="#ADBCCB" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Seeded Python generator → 8,000 synthetic records</text><path d="M480 223 v24 m-6 -7 l6 7 6 -7" fill="none" stroke="#5DE2D0" stroke-width="2"/><rect x="44" y="251" width="872" height="88" rx="10" fill="#122638" stroke="#284255"/><text x="66" y="285" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600">02  Stage</text><text x="66" y="317" fill="#ADBCCB" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Raw text tables retain source values</text><path d="M480 339 v24 m-6 -7 l6 7 6 -7" fill="none" stroke="#5DE2D0" stroke-width="2"/><rect x="44" y="367" width="872" height="88" rx="10" fill="#122638" stroke="#284255"/><text x="66" y="401" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600">03  Validate</text><text x="66" y="433" fill="#ADBCCB" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">SQL normalization, key resolution and quarantine</text><path d="M480 455 v24 m-6 -7 l6 7 6 -7" fill="none" stroke="#5DE2D0" stroke-width="2"/><rect x="44" y="483" width="872" height="88" rx="10" fill="#122638" stroke="#284255"/><text x="66" y="517" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600">04  Model</text><text x="66" y="549" fill="#ADBCCB" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Constrained manufacturing tables → four analytics views</text><path d="M480 571 v24 m-6 -7 l6 7 6 -7" fill="none" stroke="#5DE2D0" stroke-width="2"/><rect x="44" y="599" width="872" height="88" rx="10" fill="#122638" stroke="#284255"/><text x="66" y="633" fill="#F1F5F9" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="600">05  Explore</text><text x="66" y="665" fill="#ADBCCB" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Power BI yield overview + failure analysis</text><text x="44" y="788" fill="#E4B974" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400">All findings describe a synthetic scenario, not a real factory.</text></svg>