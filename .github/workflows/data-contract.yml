name: Synthetic data and SQL contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: docker compose -p portfolio-ci up -d --wait
      - name: Build and reconcile synthetic SQL model
        run: |
          docker compose -p portfolio-ci exec -T postgres psql -U postgres -d postgres -f /project/database/run_all.sql
          docker compose -p portfolio-ci exec -T postgres psql -U postgres -d postgres -f /project/database/06_regression.sql
      - name: Verify rerunnable load
        run: |
          docker compose -p portfolio-ci exec -T postgres psql -U postgres -d postgres -f /project/database/run_all.sql
          docker compose -p portfolio-ci exec -T postgres psql -U postgres -d postgres -f /project/database/06_regression.sql
      - name: Clean up this runner's disposable fixture
        if: always()
        run: docker compose -p portfolio-ci down -v
